services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: "en,ru"      # грузим только нужные языки: быстрее старт, меньше памяти
      LT_CHAR_LIMIT: "4000"      # совпадает с maxTextLength в боте
      LT_UPDATE_MODELS: "false"
    volumes:
      - lt-models:/home/libretranslate/.local   # модели сохраняются между перезапусками
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  lt-models: